<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InvoiceGuard AI</title><style>body{font-family:Arial,sans-serif;max-width:1100px;margin:40px auto;padding:0 18px;background:#f7f8fb}h1{margin-bottom:4px}.sub{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;padding:18px;border-radius:14px;box-shadow:0 3px 15px rgba(0,0,0,.06)}label{display:block;font-size:13px;margin:8px 0 4px;color:#475467}input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d0d5dd;border-radius:8px}button{margin-top:16px;padding:11px 16px;border:0;border-radius:8px;cursor:pointer}.result{white-space:pre-wrap;font-family:ui-monospace,monospace;background:#111827;color:#e5e7eb;padding:16px;border-radius:10px;min-height:180px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><h1>InvoiceGuard AI</h1><div class="sub">Predictive invoice payment risk & cash-flow protection</div><div class="grid"><div class="card"><h3>Invoice</h3><label>Invoice Date</label><input id="invoice_date" value="2026-09-01"><label>Due Date</label><input id="due_date" value="2026-10-01"><label>Invoice Amount</label><input id="invoice_amount" type="number" value="50000"><label>Prior Invoice Count</label><input id="customer_seen_before" type="number" value="6"><label>Prior Late Count</label><input id="prior_late_count" type="number" value="3"><label>Prior Late Ratio</label><input id="prior_late_ratio" type="number" step=".01" value="0.5"><label>Prior Avg Delay</label><input id="prior_avg_delay" type="number" step=".1" value="9"><label>Outstanding Amount</label><input id="outstanding_amount" type="number" value="80000"></div><div class="card"><h3>Customer profile</h3><label>Industry</label><select id="industry"><option>Construction</option><option>Retail</option><option>IT</option><option>Manufacturing</option><option>Services</option></select><label>Company Size</label><select id="company_size"><option>Small</option><option>Medium</option><option>Large</option></select><label>Payment Method</label><select id="payment_method"><option>Bank Transfer</option><option>Cheque</option><option>Card</option><option>Cash</option></select><label>Customer Segment</label><select id="customer_segment"><option>SME</option><option>Mid-Market</option><option>Enterprise</option></select><button onclick="predict()">Predict Risk</button><h3>Result</h3><div class="result" id="out">Ready.</div></div></div><script>async function predict(){const g=id=>document.getElementById(id);let body={invoice_date:g('invoice_date').value,due_date:g('due_date').value,invoice_amount:+g('invoice_amount').value,customer_seen_before:+g('customer_seen_before').value,prior_late_count:+g('prior_late_count').value,prior_late_ratio:+g('prior_late_ratio').value,prior_avg_delay:+g('prior_avg_delay').value,outstanding_amount:+g('outstanding_amount').value,industry:g('industry').value,company_size:g('company_size').value,payment_method:g('payment_method').value,customer_segment:g('customer_segment').value};let r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});g('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
